# Contrôles qualité du site vitrine.
# Flux : dev (développement) -> staging (préproduction) -> main (production).
# Le déploiement est géré par l'intégration Git de Vercel, ce workflow bloque les merges non conformes.
name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flux-branches:
    name: Flux de branches
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la branche source
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "staging" ] && [ "$HEAD" != "dev" ]; then
            echo "::error::La préproduction (staging) ne reçoit que des PR depuis dev (reçu : $HEAD)."
            exit 1
          fi
          if [ "$BASE" = "main" ] && [ "$HEAD" != "staging" ]; then
            echo "::error::La production (main) ne reçoit que des PR depuis staging (reçu : $HEAD)."
            exit 1
          fi
          echo "Flux conforme : $HEAD -> $BASE"

  qualite:
    name: Qualité du site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Règles de rédaction (CLAUDE.md)
        run: node scripts/check-redaction.mjs
      - name: Liens internes et ancres
        run: node scripts/check-links.mjs
      - name: Validation HTML
        run: npx --yes html-validate@9 ./*.html
