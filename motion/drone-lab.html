<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Banc d'essai drone FLEAT</title>
<style>body{margin:0;background:#fff}.kv{width:420px;aspect-ratio:4/3}.kv canvas{display:block;width:100%!important;height:100%!important}</style>
<script type="importmap">{"imports":{"three":"/three/three.module.js","three/addons/":"/three/addons/"}}</script>
</head><body><div class="kv" id="kv"></div>
<script type="module">
// Banc d'essai : rend une variante du drone, posée ou en vol, sur fond béton.
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { makeDrone } from './drone.js';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(840, 630, false); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.getElementById('kv').appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#e6ecf4');
scene.add(new THREE.HemisphereLight('#f4f7fc', '#b9c2cf', 1.25));
const sun = new THREE.DirectionalLight('#fff6ea', 2.4); sun.position.set(-2.5, 9, 6.5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 4;
Object.assign(sun.shadow.camera, { left: -1, right: 1, top: 1, bottom: -1 }); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: '#d8dde5', roughness: .95 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const cam = new THREE.OrthographicCamera(-.4, .4, .3, -.3, .1, 50);
let current = null;
const VARIANTS = { B: {} };
window.lab = (v, state) => {
  if (current) scene.remove(current.group);
  current = makeDrone(THREE, RoundedBoxGeometry, VARIANTS[v]);
  scene.add(current.group);
  const flying = state !== 'pose';
  current.group.position.set(0, flying ? .3 : .02, 0);
  current.group.rotation.set(0, -1.0, flying ? -.07 : 0);
  current.setSpin(flying ? 1 : 0, 1.3); current.setLights(true);
  if (state === 'photo') { cam.position.set(3.2, .55, 1.0); cam.lookAt(0, .34, 0); cam.zoom = 1.05; }
  else { cam.position.set(2.2, flying ? 1.7 : 1.35, 2.6); cam.lookAt(0, flying ? .28 : .07, 0); cam.zoom = flying ? .95 : 1.1; }
  cam.updateProjectionMatrix();
  renderer.render(scene, cam);
};
window.__ready = true;
</script></body></html>
