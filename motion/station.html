<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Station FLEAT · 3D</title>
<link rel="stylesheet" href="/styles.css">
<style>
body{background:var(--paper);padding:40px;font-family:var(--f-text)}
.demo{width:420px}
.kv{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;background:#e9eef5}
.kv canvas{display:block;width:100%!important;height:100%!important}
.kv-chip{position:absolute;left:14px;top:12px;display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;background:#fff;border:1px solid var(--line);border-radius:999px;font:600 12.5px/1 var(--f-text);color:var(--ink);box-shadow:var(--sh-sm)}
.kv-chip i{width:9px;height:9px;border-radius:50%;background:var(--ok)}
</style>
<script type="importmap">{"imports":{"three":"/three/three.module.js","three/addons/":"/three/addons/"}}</script>
</head>
<body>
<div class="demo"><div class="kv" id="kv"><span class="kv-chip"><i id="chipDot"></i><span id="chipTxt">En charge</span></span></div></div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* Unités en mètres. Cotes inspirées du Dock 3 : 640 × 745 × 770 mm capot fermé, 1 760 × 745 × 485 mm capot ouvert. */
const host = document.getElementById('kv');
const W = 840, H = 630;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#e6ecf4');
scene.fog = new THREE.Fog('#e6ecf4', 14, 30);

/* Caméra orthographique, vue de trois quarts plongeante */
const VIEW = 3.4;
const cam = new THREE.OrthographicCamera(-VIEW * 4 / 3, VIEW * 4 / 3, VIEW, -VIEW, .1, 100);
cam.position.set(7, 5.8, 7); cam.lookAt(-.35, .95, -.75); cam.zoom = 1.55; cam.updateProjectionMatrix();

/* Lumières : ciel + soleil avec ombres douces */
scene.add(new THREE.HemisphereLight('#f4f7fc', '#b9c2cf', 1.25));
const sun = new THREE.DirectionalLight('#fff6ea', 2.4);
sun.position.set(-2.5, 9, 6.5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 4; sun.shadow.bias = -.0005;
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: .5, far: 30 });
scene.add(sun);

const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .7, metalness: 0 }, o));
function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; }

/* ---------- Sol : dalle béton, joints, marquage de la zone ---------- */
function concreteTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d');
  g.fillStyle = '#d8dde5'; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 9000; i++) { const v = 200 + Math.random() * 30; g.fillStyle = `rgba(${v},${v + 3},${v + 8},.35)`; g.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2); }
  g.strokeStyle = 'rgba(150,160,175,.55)'; g.lineWidth = 2;
  for (let k = 0; k <= 1024; k += 128) { g.beginPath(); g.moveTo(k, 0); g.lineTo(k, 1024); g.stroke(); g.beginPath(); g.moveTo(0, k); g.lineTo(1024, k); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 3); t.anisotropy = 4; return t;
}
const ground = mesh(new THREE.PlaneGeometry(36, 36), M('#ffffff', { map: concreteTexture(), roughness: .95 }));
ground.rotation.x = -Math.PI / 2; ground.castShadow = false;
/* zone de sécurité peinte autour de la station */
(function () {
  const mat = M('#e7a64e', { roughness: .8 }), w = 2.6, d = 2.2, seg = .26;
  [[-w / 2, -d / 2, w / 2, -d / 2], [w / 2, -d / 2, w / 2, d / 2], [w / 2, d / 2, -w / 2, d / 2], [-w / 2, d / 2, -w / 2, -d / 2]].forEach(([x1, z1, x2, z2]) => {
    const len = Math.hypot(x2 - x1, z2 - z1), n = Math.floor(len / (seg * 2));
    for (let i = 0; i < n; i++) { const t = (i * 2 * seg + seg / 2) / len; const m = mesh(new THREE.BoxGeometry(seg, .004, .06), mat, x1 + (x2 - x1) * t, .002, z1 + (z2 - z1) * t); m.rotation.y = -Math.atan2(z2 - z1, x2 - x1); m.castShadow = false; }
  });
})();

/* ---------- Arrière-plan : clôture à bavolet, cuves, bâtiment de process ---------- */
const steel = M('#8f9aab', { metalness: .5, roughness: .45 });
const FZ = -3.4;
for (let x = -9; x <= 9.01; x += 1.5) {
  mesh(new THREE.CylinderGeometry(.03, .03, 2.1, 8), steel, x, 1.05, FZ);
  const arm = mesh(new THREE.CylinderGeometry(.02, .02, .5, 6), steel, x, 2.22, FZ - .17); arm.rotation.x = -Math.PI / 4;
}
function wireTexture() { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); g.strokeStyle = 'rgba(120,132,150,.9)'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, 0); g.lineTo(64, 64); g.moveTo(64, 0); g.lineTo(0, 64); g.stroke(); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(90, 10); return t; }
const fence = mesh(new THREE.PlaneGeometry(18, 2), new THREE.MeshStandardMaterial({ map: wireTexture(), transparent: true, side: THREE.DoubleSide, roughness: .8, depthWrite: false }), 0, 1.02, FZ);
fence.castShadow = false;
mesh(new THREE.CylinderGeometry(.018, .018, 18, 6), steel, 0, 2.08, FZ).rotation.z = Math.PI / 2;
[.13, .26, .38].forEach(k => mesh(new THREE.CylinderGeometry(.006, .006, 18, 4), M('#6f7b8f'), 0, 2.1 + k * .95, FZ - k).rotation.z = Math.PI / 2);
/* cuves de stockage */
const tankMat = M('#f3f5f8', { metalness: .2, roughness: .45 });
[[1.5, -2.6], [2.9, -1.9]].forEach(([x, z]) => {
  mesh(new THREE.CylinderGeometry(.6, .6, 2.2, 48), tankMat, x, 1.1, z);
  mesh(new THREE.SphereGeometry(.6, 48, 16, 0, Math.PI * 2, 0, Math.PI / 5), tankMat, x, 2.2 - .6 * Math.cos(Math.PI / 5), z);
  for (let r = 0; r < 3; r++) mesh(new THREE.TorusGeometry(.605, .012, 6, 48), steel, x, .45 + r * .65, z).rotation.x = Math.PI / 2;
  mesh(new THREE.CylinderGeometry(.035, .035, .45, 10), steel, x, .22, z + .62);
  /* cuvette de rétention */
  mesh(new THREE.BoxGeometry(1.45, .12, 1.45), M('#cfd5de', { roughness: .9 }), x, .06, z);
});
/* rack de tuyauterie */
[-2.6, .7, 3.8].forEach(x => mesh(new THREE.BoxGeometry(.12, 3, .12), steel, x, 1.5, -5.0));
[2.7, 2.95].forEach((y, i) => mesh(new THREE.CylinderGeometry(i ? .08 : .12, i ? .08 : .12, 7, 16), M(i ? '#b8c2d1' : '#9fb0c6', { metalness: .4, roughness: .4 }), .6, y, -5.0).rotation.z = Math.PI / 2);
/* bâtiment de process */
mesh(new THREE.BoxGeometry(4.2, 3.6, 3.4), M('#eceff4'), -6.2, 1.8, -5.2);
mesh(new THREE.BoxGeometry(4.24, .25, 3.44), M('#c9d1dd'), -6.2, 3.62, -5.2);
for (let i = 0; i < 4; i++) mesh(new THREE.BoxGeometry(.7, .55, .02), M('#9fb0c6', { metalness: .2, roughness: .3 }), -7.7 + i * 1, 2.5, -3.49);
mesh(new THREE.BoxGeometry(1.4, 1.8, .03), M('#b9c3d2'), -5.2, .9, -3.49);
/* mât d'éclairage */
mesh(new THREE.CylinderGeometry(.05, .07, 5, 10), steel, -3.2, 2.5, -3.0);
mesh(new THREE.BoxGeometry(.6, .08, .2), M('#6d788b'), -2.95, 5, -3.0);

/* ---------- Station ---------- */
const L = .64, D = .585, ZB = .058, HB = .485;
const dock = new THREE.Group(); scene.add(dock);
const white = M('#f6f8fb', { roughness: .45 }), grey = M('#2c323b', { roughness: .6 }), dark = M('#20252c', { roughness: .8 });
[[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([a, b]) => mesh(new THREE.BoxGeometry(.07, ZB, .07), grey, a * (L / 2 - .06), ZB / 2, b * (D / 2 - .06), dock));
const HC = HB - .035;
mesh(new RoundedBoxGeometry(L, HC - ZB, D, 4, .025), white, 0, ZB + (HC - ZB) / 2, 0, dock);
/* rebord supérieur : laisse la plateforme d'atterrissage encastrée */
[[0, D / 2 - .015, L, .03], [0, -D / 2 + .015, L, .03]].forEach(([x, z, lx, lz]) => mesh(new THREE.BoxGeometry(lx, .04, lz), white, x, HC + .015, z, dock));
[[L / 2 - .015, 0], [-L / 2 + .015, 0]].forEach(([x, z]) => mesh(new THREE.BoxGeometry(.03, .04, D - .06), white, x, HC + .015, z, dock));
/* joint entre caisson et capot */
const gasket = M('#4a515c', { roughness: .8 });
[[0, D / 2, L, .004], [0, -D / 2, L, .004]].forEach(([x, z, lx, lz]) => mesh(new THREE.BoxGeometry(lx, .004, lz), gasket, x, HB + .002, z, dock));
[[L / 2, 0], [-L / 2, 0]].forEach(([x, z]) => mesh(new THREE.BoxGeometry(.004, .004, D), gasket, x, HB + .002, z, dock));
/* charnières sur les arêtes supérieures gauche et droite */
const hingeMat = M('#8a94a4', { metalness: .6, roughness: .35 });
[-1, 1].forEach(sd => [D / 2 - .07, -D / 2 + .07].forEach(z => { const h = mesh(new THREE.CylinderGeometry(.009, .009, .06, 12), hingeMat, sd * (L / 2 + .002), HB + .004, z, dock); h.rotation.x = Math.PI / 2; }));
mesh(new THREE.BoxGeometry(L + .004, .035, D + .004), grey, 0, ZB + .02, 0, dock);
/* grilles de ventilation en façade */
for (let i = 0; i < 7; i++) mesh(new THREE.BoxGeometry(.012, .15, .006), M('#c3cad6'), -.2 + i * .03, .25, D / 2 + .002, dock);
/* voyant d'état */
const ledMat = new THREE.MeshStandardMaterial({ color: '#1f9d57', emissive: '#1f9d57', emissiveIntensity: 2.2 });
mesh(new THREE.CylinderGeometry(.014, .014, .008, 16), ledMat, .22, .4, D / 2 + .004, dock).rotation.x = Math.PI / 2;
/* module RTK à l'arrière et anémomètre */
mesh(new RoundedBoxGeometry(.38, .3, .16, 3, .02), white, .03, .3, -D / 2 - .08, dock);
mesh(new THREE.SphereGeometry(.055, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), M('#ffffff', { roughness: .3 }), .03, .45, -D / 2 - .08, dock);
mesh(new THREE.CylinderGeometry(.008, .008, .28, 8), grey, L / 2 - .05, HB + .14, -D / 2 + .03, dock);
mesh(new THREE.SphereGeometry(.022, 16, 12), white, L / 2 - .05, HB + .29, -D / 2 + .03, dock);
/* plateforme d'atterrissage */
mesh(new THREE.BoxGeometry(L - .06, .008, D - .06), dark, 0, HB - .028, 0, dock);
const ringMat = new THREE.MeshStandardMaterial({ color: '#e7a64e', roughness: .6, side: THREE.DoubleSide });
[[.15, .17], [.06, .075]].forEach(([a, b]) => { const r = mesh(new THREE.RingGeometry(a, b, 48), ringMat, 0, HB - .022, 0, dock); r.rotation.x = -Math.PI / 2; r.castShadow = false; });

/* Demi-capots en coque : profil bombé extrudé sur la profondeur, articulés sur un bras extérieur */
function hoodHalf(side) {
  /* Demi-capot rectangulaire articulé sur l'arête supérieure extérieure du caisson.
     Fermé, il prolonge exactement les faces du caisson ; ouvert (180°), il se couche à côté, ouverture vers le haut. */
  const t = .014, hh = .135, w = L / 2 - .002, sgn = -side, Dd = D;
  const pivot = new THREE.Group(); pivot.position.set(side * L / 2, HB + .004, 0); dock.add(pivot);
  const part = (lx, ly, lz, x, y, z) => mesh(new RoundedBoxGeometry(lx, ly, lz, 2, .004), white, sgn * x, y, z, pivot);
  part(w, t, Dd, w / 2, hh - t / 2, 0);                     /* dessus */
  part(t, hh, Dd, t / 2, hh / 2, 0);                         /* paroi extérieure */
  part(w, hh, t, w / 2, hh / 2, Dd / 2 - t / 2);             /* paroi avant */
  part(w, hh, t, w / 2, hh / 2, -Dd / 2 + t / 2);            /* paroi arrière */
  return pivot;
}
const hoodL = hoodHalf(-1), hoodR = hoodHalf(1);

/* ---------- Drone inspiré du Matrice 4D ---------- */
const drone = new THREE.Group(); scene.add(drone);
const body = M('#3a4048', { roughness: .45, metalness: .15 }), bodyD = M('#262a30', { roughness: .55 });
mesh(new RoundedBoxGeometry(.2, .07, .13, 3, .025), body, 0, .06, 0, drone);
mesh(new RoundedBoxGeometry(.12, .03, .09, 3, .012), M('#4a515b', { roughness: .4 }), -.01, .1, 0, drone);
const props = [];
[[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(([a, b]) => {
  const arm = mesh(new THREE.BoxGeometry(.2, .018, .022), bodyD, a * .09, .065, b * .09, drone); arm.rotation.y = -Math.atan2(b, a);
  mesh(new THREE.CylinderGeometry(.022, .024, .035, 16), bodyD, a * .16, .08, b * .16, drone);
  const prop = new THREE.Group(); prop.position.set(a * .16, .102, b * .16); drone.add(prop);
  mesh(new THREE.BoxGeometry(.25, .004, .022), M('#1c1f24', { roughness: .5 }), 0, 0, 0, prop);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(.125, 40), new THREE.MeshBasicMaterial({ color: '#6c7890', transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide }));
  disc.rotation.x = -Math.PI / 2; prop.add(disc);
  props.push({ g: prop, disc, dir: a * b });
  mesh(new THREE.BoxGeometry(.012, .05, .012), bodyD, a * .14, .025, b * .14, drone);
});
/* nacelle caméra à l'avant */
mesh(new THREE.SphereGeometry(.03, 20, 14), bodyD, .11, .03, 0, drone);
mesh(new RoundedBoxGeometry(.045, .04, .07, 2, .01), M('#2a2f36', { roughness: .4 }), .125, .02, 0, drone);
mesh(new THREE.CircleGeometry(.012, 20), M('#3f6db8', { roughness: .1, metalness: .6 }), .148, .022, -.015, drone).rotation.y = Math.PI / 2;
mesh(new THREE.CircleGeometry(.009, 20), M('#3f6db8', { roughness: .1, metalness: .6 }), .148, .022, .018, drone).rotation.y = Math.PI / 2;
const navR = new THREE.MeshStandardMaterial({ color: '#ff5a4f', emissive: '#ff3b30', emissiveIntensity: 2 });
const navG = new THREE.MeshStandardMaterial({ color: '#3ad07a', emissive: '#22c55e', emissiveIntensity: 2 });
mesh(new THREE.SphereGeometry(.008, 10, 8), navR, .16, .085, -.16, drone);
mesh(new THREE.SphereGeometry(.008, 10, 8), navG, .16, .085, .16, drone);
drone.rotation.y = Math.PI / 4; drone.scale.setScalar(.88);

/* ---------- Chronologie (12 s) ---------- */
const T = 12, ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const seg = (t, a, b) => t <= a ? 0 : t >= b ? 1 : ease((t - a) / (b - a)), lerp = (a, b, p) => a + (b - a) * p;
const PAD = HB - .024, HOVER = 1.55;
const dot = document.getElementById('chipDot'), txt = document.getElementById('chipTxt');
function render(t) {
  t = ((t % T) + T) % T;
  const lid = Math.PI * (seg(t, 1, 2.4) - seg(t, 4.6, 5.6) + seg(t, 9.3, 10.1) - seg(t, 11.1, 11.9));
  hoodL.rotation.z = lid; hoodR.rotation.z = -lid;
  const spin = seg(t, 2.3, 2.8) - seg(t, 10.9, 11.2);
  let p = null, op = 1;
  if (t < 3) p = [0, PAD, 0];
  else if (t < 4.6) p = [0, lerp(PAD, HOVER, seg(t, 3, 4.6)), 0];
  else if (t < 7) { const q = seg(t, 5.2, 7); p = [lerp(0, -3.2, q), lerp(HOVER + .03 * Math.sin(t * 3), 3.2, q), lerp(0, -3.8, q)]; op = t > 6.3 ? 1 - (t - 6.3) / .7 : 1; }
  else if (t < 8) p = null;
  else if (t < 9.6) { const q = seg(t, 8, 9.6); p = [lerp(-3.2, 0, q), lerp(3.2, 1.2, q), lerp(-3.8, 0, q)]; op = t < 8.6 ? (t - 8) / .6 : 1; }
  else p = [0, lerp(1.2, PAD, seg(t, 9.9, 11)), 0];
  drone.visible = !!p;
  if (p) drone.position.set(p[0], p[1], p[2]);
  props.forEach(pr => { pr.g.rotation.y = t * 60 * pr.dir * spin + pr.dir * .6; pr.disc.material.opacity = .32 * spin; pr.g.children[0].visible = spin < .6; });
  const mission = t >= 4.6 && t < 11.2, col = mission ? '#2f62ea' : '#1f9d57';
  ledMat.color.set(col); ledMat.emissive.set(col); dot.style.background = col;
  const on = Math.floor(t * 2) % 2 === 0; navR.emissiveIntensity = navG.emissiveIntensity = on ? 2.4 : .2;
  txt.textContent = t >= 9.3 && t < 11.2 ? 'Retour' : mission ? 'En mission' : (t >= 1 && t < 4.6 ? 'Décollage' : 'En charge');
  renderer.render(scene, cam);
}
window.fleatStationRender = render;
if (matchMedia('(prefers-reduced-motion: reduce)').matches) render(4.2);
else { const t0 = performance.now(); (function loop(now) { if (window.__fleatFrozen === undefined) render((now - t0) / 1000); requestAnimationFrame(loop); })(t0); }
window.__ready = true;
</script>
</body></html>
